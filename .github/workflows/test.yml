name: Test

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openml-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: '3.12'
      - name: Reproduce the OpenML task-cache request
        run: uv run --no-project --with openml==0.15.1 python -u .github/scripts/diagnose_openml.py

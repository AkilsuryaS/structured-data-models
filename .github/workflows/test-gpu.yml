name: Test GPU

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  categorical-cuda:
    name: Categorical CUDA (torch ${{ matrix.torch }}, ${{ matrix.backend }})
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: '2.7.1'
            backend: cu128
          - torch: '2.14.0'
            backend: cu130
    env:
      PYTHONUNBUFFERED: '1'
      EXPECTED_TORCH: ${{ matrix.torch }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install focused dependencies
        run: |
          uv --no-config pip install \
            --torch-backend="${{ matrix.backend }}" \
            . pytest pandas "torch==${{ matrix.torch }}"

      - name: GPU and source sanity check
        run: |
          git rev-parse HEAD
          sha256sum \
            sdm/processing/categorical/_categorical.py \
            sdm/processing/categorical/count.py \
            sdm/processing/categorical/impute.py \
            sdm/tensor/categorical.py \
            sdm/tensor/var_len.py \
            test/processing/categorical/test_categorical.py
          nvidia-smi
          python - <<'PY'
          import os
          import torch

          print("torch", torch.__version__)
          print("CUDA runtime", torch.version.cuda)
          assert torch.__version__.split("+")[0] == os.environ["EXPECTED_TORCH"]
          assert torch.cuda.is_available(), "CUDA not available to torch"
          print("GPU", torch.cuda.get_device_name())
          PY

      - name: Run categorical CUDA regression
        env:
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/categorical-cuda-${{ matrix.torch }}
        run: |
          pytest test/processing/categorical/test_categorical.py \
            -m cuda -ra --durations=10

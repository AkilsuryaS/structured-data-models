version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.11'
  jobs:
    post_checkout:
      - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow; fi
      - git fetch --tags
    post_install:
      - python -m pip install uv
      - python -m uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --torch-backend=cpu --group=doc .

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
